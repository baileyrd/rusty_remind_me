<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 780" role="img" aria-label="An operator configures sources, runs backups, browses and monitors, exports data, verifies and restores, maintains the database, and researches a topic, all inside the rusty_dbs system boundary. A scheduler actor can also trigger a run of Run a backup on an interval. Run a backup includes Pull items via connector, which is the only use case that reaches out to the external source API, crossing the same subprocess boundary shown in the architecture diagram. Research a topic reaches out to NotebookLM.">
  <title>rusty_dbs use cases</title>
  <style>
    :root {
      --bg: #f5f3ee;
      --surface: #ffffff;
      --surface-2: #edeae1;
      --ink: #1e2129;
      --ink-soft: #5b6370;
      --ink-faint: #88909999;
      --line: #cbd0d6;
      --accent: #2f6b6f;
      --accent-tint: #e2edec;
      --accent-2: #b6612a;
      --accent-2-tint: #f5e7d9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161b;
        --surface: #1b1e25;
        --surface-2: #22262f;
        --ink: #eceef2;
        --ink-soft: #9aa2b1;
        --ink-faint: #6b7280;
        --line: #333844;
        --accent: #6bbab5;
        --accent-tint: #1c2b2a;
        --accent-2: #e0955a;
        --accent-2-tint: #2c2216;
      }
    }
    svg { background: var(--bg); font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
    .node-title { fill: var(--ink); font-size: 14px; font-weight: 600; text-anchor: middle; }
    .node-sub { fill: var(--ink-soft); font-size: 10.6px; text-anchor: middle; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .edge { fill: none; stroke: var(--ink-soft); stroke-width: 1.5; }
    .edge-dashed { fill: none; stroke: var(--ink-faint); stroke-width: 1.4; stroke-dasharray: 5 5; }
    .edge-accent { stroke: var(--accent-2); }
    .edge-label { fill: var(--ink-soft); font-size: 11px; }
    .edge-label-em { fill: var(--accent-2); font-size: 10.5px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .boundary-rect { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.4; opacity: 0.9; }
    .boundary-title { fill: var(--accent); font-size: 14px; font-weight: 700; letter-spacing: 0.02em; }
    .oval { fill: var(--surface); stroke: var(--line); stroke-width: 1.4; }
    .oval-inc { fill: var(--accent-2-tint); stroke: var(--accent-2); stroke-width: 1.3; }
    .actor-line { stroke: var(--ink); stroke-width: 1.6; fill: none; }
    .actor-label { fill: var(--ink); font-size: 13px; font-weight: 600; text-anchor: middle; }
    .actor-sub { fill: var(--ink-soft); font-size: 10.5px; text-anchor: middle; }
    .system-rect { fill: var(--accent-2-tint); stroke: var(--accent-2); stroke-width: 1.3; stroke-dasharray: 4 4; }
    .system-title { fill: var(--accent-2); font-size: 13px; font-weight: 700; text-anchor: middle; }
    .system-sub { fill: var(--ink-soft); font-size: 10px; text-anchor: middle; }
    .assoc { stroke: var(--ink-faint); stroke-width: 1.2; fill: none; }
  </style>

  <rect width="1260" height="780" fill="var(--bg)"></rect>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink-soft)"></path>
    </marker>
    <marker id="arrow2accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"></path>
    </marker>
  </defs>

  <!-- system boundary -->
  <rect class="boundary-rect" x="220" y="40" width="760" height="700" rx="18"></rect>
  <text class="boundary-title" x="248" y="70">rusty_dbs</text>

  <!-- actor associations (operator) drawn first, under everything -->
  <g class="assoc">
    <line x1="100" y1="260" x2="270" y2="110"></line>
    <line x1="100" y1="260" x2="270" y2="230"></line>
    <line x1="100" y1="260" x2="270" y2="470"></line>
    <line x1="100" y1="260" x2="270" y2="590"></line>
    <line x1="100" y1="260" x2="270" y2="690"></line>
    <line x1="100" y1="260" x2="650" y2="150"></line>
    <line x1="100" y1="260" x2="650" y2="420"></line>
  </g>

  <!-- use case ovals: left column -->
  <ellipse class="oval" cx="420" cy="110" rx="150" ry="42"></ellipse>
  <text class="node-title" x="420" y="105">Configure sources</text>
  <text class="node-sub" x="420" y="121">init &#183; sources &#183; connectors &#183; capture</text>

  <ellipse class="oval" cx="420" cy="230" rx="150" ry="42"></ellipse>
  <text class="node-title" x="420" y="225">Run a backup</text>
  <text class="node-sub" x="420" y="241">backup --all / backup &lt;source&gt;</text>

  <ellipse class="oval" cx="420" cy="350" rx="150" ry="42"></ellipse>
  <text class="node-title" x="420" y="345">Schedule backups</text>
  <text class="node-sub" x="420" y="361">schedule &#183; serve --schedule</text>

  <ellipse class="oval" cx="420" cy="470" rx="150" ry="42"></ellipse>
  <text class="node-title" x="420" y="465">Browse &amp; monitor</text>
  <text class="node-sub" x="420" y="481">status &#183; items &#183; history &#183; stats</text>

  <ellipse class="oval" cx="420" cy="590" rx="150" ry="42"></ellipse>
  <text class="node-title" x="420" y="585">Export data</text>
  <text class="node-sub" x="420" y="601">export &#183; notes &#183; profiles &#183; wiki</text>

  <ellipse class="oval" cx="420" cy="690" rx="150" ry="42"></ellipse>
  <text class="node-title" x="420" y="685">Research a topic</text>
  <text class="node-sub" x="420" y="701">research &#8594; NotebookLM pipeline</text>

  <!-- use case ovals: right column -->
  <ellipse class="oval" cx="800" cy="150" rx="150" ry="42"></ellipse>
  <text class="node-title" x="800" y="145">Verify &amp; restore</text>
  <text class="node-sub" x="800" y="161">verify &#183; restore &#183; decrypt</text>

  <ellipse class="oval-inc" cx="800" cy="280" rx="140" ry="36"></ellipse>
  <text class="node-title" x="800" y="276" style="font-size:12.5px;">Pull via connector</text>
  <text class="node-sub" x="800" y="291">subprocess fetch</text>

  <ellipse class="oval" cx="800" cy="420" rx="150" ry="42"></ellipse>
  <text class="node-title" x="800" y="415">Maintain the database</text>
  <text class="node-sub" x="800" y="431">maintain &#183; doctor &#183; update-ytdlp</text>

  <!-- include / trigger relations -->
  <line class="edge-dashed" x1="420" y1="308" x2="420" y2="272" marker-end="url(#arrow2)"></line>
  <text class="edge-label-em" x="440" y="292">&#171;include&#187;</text>

  <line class="edge-dashed" x1="565" y1="242" x2="672" y2="272" marker-end="url(#arrow2)"></line>
  <text class="edge-label-em" x="600" y="248">&#171;include&#187;</text>

  <line class="edge-dashed edge-accent" x1="150" y1="480" x2="270" y2="360" marker-end="url(#arrow2accent)"></line>
  <text class="edge-label" x="130" y="440" text-anchor="middle">triggers on interval</text>

  <!-- reaching outside the system -->
  <line class="edge edge-accent" x1="940" y1="280" x2="1030" y2="283" marker-end="url(#arrow2accent)"></line>
  <text class="edge-label-em" x="985" y="270" text-anchor="middle">fetch</text>

  <line class="edge" x1="565" y1="700" x2="1030" y2="655" marker-end="url(#arrow2)"></line>
  <text class="edge-label" x="800" y="690" text-anchor="middle">loads sources</text>

  <!-- operator actor -->
  <g>
    <circle cx="100" cy="235" r="17" fill="none" stroke="var(--ink)" stroke-width="1.6"></circle>
    <line class="actor-line" x1="100" y1="252" x2="100" y2="300"></line>
    <line class="actor-line" x1="76" y1="272" x2="124" y2="272"></line>
    <line class="actor-line" x1="100" y1="300" x2="82" y2="332"></line>
    <line class="actor-line" x1="100" y1="300" x2="118" y2="332"></line>
    <text class="actor-label" x="100" y="356">Operator</text>
  </g>

  <!-- scheduler actor -->
  <g>
    <circle cx="100" cy="560" r="27" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.6"></circle>
    <line x1="100" y1="560" x2="100" y2="542" stroke="var(--ink)" stroke-width="1.6"></line>
    <line x1="100" y1="560" x2="114" y2="566" stroke="var(--ink)" stroke-width="1.6"></line>
    <text class="actor-label" x="100" y="612">Scheduler</text>
    <text class="actor-sub" x="100" y="627">interval timer</text>
  </g>

  <!-- external systems -->
  <rect class="system-rect" x="1030" y="238" width="180" height="90" rx="10"></rect>
  <text class="system-title" x="1120" y="278">Source platform</text>
  <text class="system-sub" x="1120" y="296">GitHub &#183; YouTube &#183; Readwise &#183; &#8230;</text>

  <rect class="system-rect" x="1030" y="610" width="180" height="90" rx="10"></rect>
  <text class="system-title" x="1120" y="650">NotebookLM</text>
  <text class="system-sub" x="1120" y="668">external research tool</text>
</svg>
