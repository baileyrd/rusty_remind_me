# The single source of truth for which compiler builds and lints this repo.
#
# Before this file, CI resolved Rust with `dtolnay/rust-toolchain@stable` and a
# developer used whatever they happened to have. Those drift, and the drift is
# invisible until CI fails: in the container that produced #211, clippy 0.1.94
# locally and 1.97.0 in CI disagreed about `useless_borrows_in_formatting`,
# which does not exist in 1.94. A clean local run and a red CI run were both
# accurate reports of different compilers.
#
# `rustup` honours this file for every cargo invocation in this directory, so
# pinning it here fixes both sides at once rather than only CI.
#
# Upgrading is deliberate: bump `channel`, open a PR, and its CI run is the
# test. That is the point — a toolchain change becomes something you can see in
# a diff and revert, instead of arriving on whoever opens the next PR.
[toolchain]
channel = "1.97.0"
# Named here rather than in the workflow so `cargo clippy` and `cargo fmt` work
# on a fresh clone without anyone reading CI to find out what to install.
components = ["clippy", "rustfmt"]
