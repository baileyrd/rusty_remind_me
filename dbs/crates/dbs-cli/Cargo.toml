[package]
name = "dbs-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for rusty_dbs, mirroring dbs.cli.__main__/cli.py in baileyrd/Daily-Backup-System"

[[bin]]
name = "dbs"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3"
dbs-core = { path = "../dbs-core" }
dbs-research = { path = "../dbs-research" }
dbs-web = { path = "../dbs-web" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
# Test-only: gives integration tests a real dbs-connector-<type> binary
# (CARGO_BIN_EXE_dbs-connector-raindrop) to exercise issue #160's real
# discovery against, instead of only ever finding nothing.
dbs-connector-raindrop = { path = "../dbs-connector-raindrop" }
