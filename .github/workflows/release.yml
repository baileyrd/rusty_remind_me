name: Release

# Watches every push to `main` that touches the root Cargo.toml. If
# `[workspace.package].version` there is ahead of the last `vX.Y.Z` tag this
# repo published, this builds the CLI/hub binaries and the Claude Code
# plugin archive and publishes them as a GitHub Release tagged to that
# version -- see the "Releases and versioning" section of README.md.
#
# Deliberately one workflow, not "tag on version bump" + a second workflow
# triggered by that tag push: a tag pushed with the default GITHUB_TOKEN does
# not trigger other workflow runs (GitHub's own loop-prevention), so a
# two-workflow split would silently never build anything. `softprops/action-
# gh-release` creates the tag itself as part of creating the release, in the
# same run that already did the version-bump detection.

on:
  push:
    branches: [main]
    paths: ["Cargo.toml"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap and toolchain-independent, same shape as ci.yml's schema-drift
  # job: report in seconds whether there is anything to release before any
  # platform build spins up.
  detect-version:
    name: detect version bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_new: ${{ steps.version.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, not just this branch's history -- the existing-tag check
          # below needs every `vX.Y.Z` this repo has ever published.
          fetch-depth: 0

      - id: version
        name: Read the workspace version and check for an existing release tag
        run: |
          set -euo pipefail
          version="$(remind_me/scripts/get_workspace_version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already tagged -- nothing to release."
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "v$version is new -- will build and publish a release."
          fi

  # One native build per platform -- no cross-compilation. `remind_me_hub`'s
  # default `postgres-store` feature pulls in the pure-Rust `postgres` crate
  # (no libpq, no TLS feature enabled) and `rusqlite`'s `bundled` feature
  # compiles SQLite from source via `cc`, both of which need only the C
  # toolchain each of these runner images already ships -- so a native build
  # per OS is simpler and more reliable here than teaching one Linux runner
  # to cross-compile for four targets.
  build:
    name: build (${{ matrix.target }})
    needs: detect-version
    if: needs.detect-version.outputs.is_new == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # `macos-13` (the Intel-native runner this target originally used)
          # was fully retired by GitHub in December 2025 -- a job requesting
          # it queues forever with no runner ever assigned, discovered when
          # v0.1.1's release run sat queued for over an hour. Building
          # `x86_64-apple-darwin` on the same `macos-14` (arm64) runner as
          # the aarch64 leg instead: Xcode's toolchain cross-links either
          # Apple Silicon or Intel object code from an arm64 host without
          # needing Rosetta or a second physical architecture, so this loses
          # nothing -- it only stops depending on a second, separately
          # deprecatable macOS runner image existing at all.
          # `macos-14` itself starts deprecating 2026-07-06, fully
          # unsupported 2026-11-02 -- if this queues indefinitely again after
          # that, replace both entries below with whatever runner label is
          # current then (`macos-15` was next in line as of this writing).
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Add the release target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-${{ matrix.target }}-

      # Default features only, matching what README tells a from-source user
      # to build -- the heavy optional features (ann, ocr, rerank,
      # local-embed, audio, cloud-backup) each take explicit model/credential
      # setup that a downloaded binary can't carry anyway.
      # `--workspace` rather than the previous `-p rusty-remind-me -p
      # remind_me_hub`, because this repo now has 17 shippable binaries, not
      # 2: the two above plus `dbs` and its 14 `dbs-connector-<type>`
      # subprocess binaries. The connectors are not optional extras — `dbs`
      # discovers and spawns them at runtime, so a release carrying `dbs`
      # without them ships a backup tool that can back nothing up
      # (dbs/docs/adr/0001-dynamic-plugin-registry.md).
      - name: Build every shippable binary (release)
        run: cargo build --release --locked --target ${{ matrix.target }} --workspace

      - name: Package the archive (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.detect-version.outputs.version }}"
          stage="rusty-recall-v${version}-${{ matrix.target }}"
          bindir="target/${{ matrix.target }}/release"
          mkdir "$stage"
          cp "$bindir/rusty-remind-me" "$bindir/rusty-remind-me-hub" "$bindir/dbs" "$stage/"
          # Globbed rather than listed: the connector set is defined by the
          # workspace members, and a hand-maintained list here would quietly
          # stop shipping the 15th connector the day someone adds one. The
          # `-x` test is what keeps cargo's `.d` depfiles out of the archive.
          for connector in "$bindir"/dbs-connector-*; do
            [ -f "$connector" ] && [ -x "$connector" ] && cp "$connector" "$stage/"
          done
          # Fail loudly rather than shipping a half-empty archive: `dbs`
          # without its connectors is a backup tool that cannot reach a single
          # source, and that is not something to discover from a bug report.
          shipped="$(find "$stage" -name 'dbs-connector-*' | wc -l)"
          if [ "$shipped" -ne 14 ]; then
            echo "expected 14 connector binaries in $stage, found $shipped" >&2
            exit 1
          fi
          cp README.md "$stage/"
          tar czf "${stage}.tar.gz" "$stage"
          echo "ASSET_PATH=${stage}.tar.gz" >> "$GITHUB_ENV"

      - name: Package the archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.detect-version.outputs.version }}"
          $stage = "rusty-recall-v$version-${{ matrix.target }}"
          $bindir = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "$bindir/rusty-remind-me.exe" "$stage/"
          Copy-Item "$bindir/rusty-remind-me-hub.exe" "$stage/"
          Copy-Item "$bindir/dbs.exe" "$stage/"
          # Same glob-don't-list reasoning as the Linux/macOS step above.
          Copy-Item "$bindir/dbs-connector-*.exe" "$stage/"
          $shipped = (Get-ChildItem "$stage/dbs-connector-*.exe").Count
          if ($shipped -ne 14) {
            Write-Error "expected 14 connector binaries in $stage, found $shipped"
            exit 1
          }
          Copy-Item README.md "$stage/"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          echo "ASSET_PATH=$stage.zip" >> $env:GITHUB_ENV

      - name: Upload the archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.target }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  # A second, independent asset: the Claude Code plugin surface, zipped up
  # so it can be grabbed from the Release page without cloning the repo.
  # Separate job from `build` because it needs no Rust toolchain at all.
  package-plugin:
    name: package Claude Code plugin
    needs: detect-version
    if: needs.detect-version.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Belt-and-suspenders: ci.yml's plugin-version job should already have
      # blocked any PR where this drifted, but a release must never ship a
      # plugin archive silently claiming the wrong version.
      - name: Verify plugin.json version matches this release
        run: remind_me/scripts/check_plugin_version.sh

      - name: Build the plugin archive
        run: |
          set -euo pipefail
          version="${{ needs.detect-version.outputs.version }}"
          stage="rusty-remind-me-plugin-v${version}"
          mkdir "$stage"
          # The plugin's own surface lives in the rusty_remind_me half, but
          # the marketplace manifest that points at it has to sit at the
          # repository root (Claude Code only reads /.claude-plugin/
          # marketplace.json), so the archive is assembled from both places.
          cp -R remind_me/.claude-plugin remind_me/commands remind_me/hooks \
                remind_me/.mcp.json remind_me/README.md "$stage/"
          mkdir "$stage/marketplace"
          cp .claude-plugin/marketplace.json "$stage/marketplace/"
          zip -rq "${stage}.zip" "$stage"
          echo "ASSET_PATH=${stage}.zip" >> "$GITHUB_ENV"

      - name: Upload the archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-plugin
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    needs: [detect-version, build, package-plugin]
    if: needs.detect-version.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download every platform/plugin archive built above
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-asset-*
          merge-multiple: true

      # Creates the vX.Y.Z tag (pointed at this run's commit) and the
      # Release together -- see the loop-prevention note at the top of this
      # file for why that happens here rather than via a separate tag push.
      - name: Create the release and attach all archives
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version.outputs.version }}
          name: v${{ needs.detect-version.outputs.version }}
          generate_release_notes: true
          files: dist/*
