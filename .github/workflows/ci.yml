name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: build / test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Formatting first: it is the cheapest gate and needs no compilation.
      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      # --all-targets so tests and benches are linted too, not just lib/bin.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Optional features are off by default, so the steps above never compile
      # them. Without this, a feature could rot untested and only break for
      # whoever actually enabled it.
      - name: cargo test --features pdf
        run: cargo test -p remind_me_core --features pdf --locked

      - name: cargo clippy --features pdf
        run: cargo clippy -p remind_me_core --features pdf --all-targets --locked -- -D warnings

      # The AWS SDK is a large tree, so this is a build+clippy check rather
      # than a second full test run — the plaintext gate that actually matters
      # is a pure function of the environment and is covered unconditionally
      # by the default-feature test run above.
      - name: cargo clippy --features cloud-backup
        run: cargo clippy -p remind_me_core --features cloud-backup --all-targets --locked -- -D warnings

      # usearch builds a C++ library from source (~5 min), so this runs the
      # tests rather than only clippy: the equivalence check — that narrowing
      # never drops a row brute force would rank — is the whole reason the
      # feature is safe to enable, and it has to actually run somewhere.
      - name: cargo test --features ann
        run: cargo test -p remind_me_core --features ann --locked

      # OCR and transcription are build+clippy checks rather than test runs:
      # neither can do its actual job without a model, and downloading one in
      # CI is precisely the implicit fetch these features are required never
      # to perform. Everything that *is* checkable without a model — the
      # feature-off refusals, the model-configuration errors, and the audio
      # decode/resample arithmetic — runs unconditionally in the default test
      # run above, so this step is only proving the feature-on code compiles.
      - name: cargo clippy --features ocr
        run: cargo clippy -p remind_me_core --features ocr --all-targets --locked -- -D warnings

      - name: cargo clippy --features audio
        run: cargo clippy -p remind_me_core --features audio --all-targets --locked -- -D warnings

      # This one runs the tests rather than only clippy, unlike ocr/audio
      # above. The difference is that its feature-on tests assert something a
      # build check cannot: that compiling the reranker in does *not* turn a
      # search into a model download, and that a configured-but-unloadable
      # model still degrades to RRF order. Both are cheap — rten and
      # tokenizers are pure Rust and the tests need no model.
      - name: cargo test --features rerank
        run: cargo test -p remind_me_core --features rerank --locked

      # Like `rerank` above, this runs the tests rather than only clippy, and
      # for a stronger reason: the feature's entire claim is that a thread
      # wedged in CPU-bound code still gets dumped. Only running it can show
      # that. A compile check would pass against a build that dumps nothing.
      #
      # The `apt-get` is the cost this feature carries and no other one here
      # does -- `rstack-self` links libunwind's ptrace API, a *system* library.
      # It is installed in this step rather than a global one so the expense
      # lands on the job that actually needs it, and so its absence keeps
      # breaking any future step that forgets it.
      # liblzma-dev is not optional here, and its absence is not obvious.
      # libunwind-ptrace.so carries undefined lzma_* references; whether they
      # resolve depends on whether the local libunwind.so happens to declare
      # DT_NEEDED on liblzma, which differs between builds. remind_me_core's
      # build.rs asks for -llzma explicitly so it never depends on that
      # accident -- which means the dev package has to be here.
      - name: Install libunwind and liblzma (stack-dumps needs both)
        run: sudo apt-get update && sudo apt-get install -y libunwind-dev liblzma-dev

      - name: cargo test --features stack-dumps
        run: cargo test -p remind_me_core --features stack-dumps --locked

      - name: cargo clippy --features stack-dumps
        run: cargo clippy -p remind_me_core --features stack-dumps --all-targets --locked -- -D warnings
  # A separate job, not more steps on `check`, because it needs a Postgres
  # service container and the rest of the workspace does not. Keeping it apart
  # means the main gate is not held up by a database that takes seconds to
  # become healthy, and a Postgres outage cannot red-X the whole workspace.
  hub:
    name: hub (sqlite + postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hubtest
        ports:
          - 5432:5432
        # Without this the job races the database's startup; `pg_isready`
        # gates on the server actually accepting connections, not just the
        # container existing.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-hub-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-hub-

      - name: cargo clippy -p remind_me_hub
        run: cargo clippy -p remind_me_hub --all-targets --locked -- -D warnings

      # No DATABASE_URL: the Postgres tests skip themselves, which is the path
      # a contributor without a database takes. Running it here proves that
      # path stays green rather than only ever being claimed.
      - name: cargo test -p remind_me_hub (sqlite only)
        run: cargo test -p remind_me_hub --locked

      # The run that matters: the legacy-schema migration and the
      # both-backends-agree differential only execute with a real server.
      - name: cargo test -p remind_me_hub (with postgres)
        env:
          REMIND_ME_HUB_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hubtest
          # A skipped Postgres test reports as *passed* and cargo hides the
          # SKIP line, so losing the service container here would look
          # identical to a clean run. This makes that a hard failure instead.
          REMIND_ME_HUB_REQUIRE_POSTGRES: "1"
        run: cargo test -p remind_me_hub --locked -- --test-threads=1

      # The SQLite-only build must keep working: it is what a self-hosted hub
      # that wants no Postgres driver actually compiles, and a `postgres::`
      # reference leaking outside the feature gate would only show up here.
      - name: cargo test -p remind_me_hub --no-default-features
        run: cargo test -p remind_me_hub --no-default-features --locked
