name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: build / test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Formatting first: it is the cheapest gate and needs no compilation.
      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      # --all-targets so tests and benches are linted too, not just lib/bin.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Optional features are off by default, so the steps above never compile
      # them. Without this, a feature could rot untested and only break for
      # whoever actually enabled it.
      - name: cargo test --features pdf
        run: cargo test -p remind_me_core --features pdf --locked

      - name: cargo clippy --features pdf
        run: cargo clippy -p remind_me_core --features pdf --all-targets --locked -- -D warnings

      # The AWS SDK is a large tree, so this is a build+clippy check rather
      # than a second full test run — the plaintext gate that actually matters
      # is a pure function of the environment and is covered unconditionally
      # by the default-feature test run above.
      - name: cargo clippy --features cloud-backup
        run: cargo clippy -p remind_me_core --features cloud-backup --all-targets --locked -- -D warnings

      # usearch builds a C++ library from source (~5 min), so this runs the
      # tests rather than only clippy: the equivalence check — that narrowing
      # never drops a row brute force would rank — is the whole reason the
      # feature is safe to enable, and it has to actually run somewhere.
      - name: cargo test --features ann
        run: cargo test -p remind_me_core --features ann --locked

      # OCR and transcription are build+clippy checks rather than test runs:
      # neither can do its actual job without a model, and downloading one in
      # CI is precisely the implicit fetch these features are required never
      # to perform. Everything that *is* checkable without a model — the
      # feature-off refusals, the model-configuration errors, and the audio
      # decode/resample arithmetic — runs unconditionally in the default test
      # run above, so this step is only proving the feature-on code compiles.
      - name: cargo clippy --features ocr
        run: cargo clippy -p remind_me_core --features ocr --all-targets --locked -- -D warnings

      - name: cargo clippy --features audio
        run: cargo clippy -p remind_me_core --features audio --all-targets --locked -- -D warnings
