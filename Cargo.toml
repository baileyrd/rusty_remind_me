[workspace]
resolver = "2"
members = [
    "crates/dbs-core",
    "crates/dbs-connector-support",
    "crates/dbs-cli",
    "crates/dbs-web",
    "crates/dbs-research",
    "crates/dbs-connector-raindrop",
    "crates/dbs-connector-github",
    "crates/dbs-connector-pinboard",
    "crates/dbs-connector-readwise",
    "crates/dbs-connector-mastodon",
    "crates/dbs-connector-bluesky",
    "crates/dbs-connector-spotify",
    "crates/dbs-connector-pocketcasts",
    "crates/dbs-connector-podcast",
    "crates/dbs-connector-vimeo",
