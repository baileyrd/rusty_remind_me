[workspace]
resolver = "2"
members = [
    "crates/remind_me_core",
    "crates/remind_me_mcp",
    "crates/remind_me_api",
    "crates/remind_me_cli",
    "crates/remind_me_remote",
    "crates/remind_me_hub",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The oldest toolchain this workspace has actually been observed to build and
# test with — not a bisected minimum. 1.94 is what this repo was developed
# against before `rust-toolchain.toml` pinned 1.97, so it is a floor that has
# been demonstrated rather than assumed. The true minimum is probably lower;
# claiming a number nobody has run would be worse than claiming a slightly
# conservative one.
#
# Distinct from `rust-toolchain.toml`, which pins what CI and developers
# *build* with. This says what a consumer needs.
rust-version = "1.94"
license = "MIT"
authors = ["rusty_remind_me contributors"]

[workspace.dependencies]
remind_me_core = { path = "crates/remind_me_core" }
remind_me_mcp = { path = "crates/remind_me_mcp" }
remind_me_api = { path = "crates/remind_me_api" }
remind_me_remote = { path = "crates/remind_me_remote" }
remind_me_hub = { path = "crates/remind_me_hub" }

# Rusty Mill ecosystem dependencies
#
# Intentionally not declared. Every crate in this workspace previously listed
# the `rusty_*` crates as `../Rusty_Mill/...` path dependencies, but no source
# file referenced any of them — the workspace failed to load because those
# paths do not exist, without a single call site depending on them.
#
# Upstream, Rusty Mill is ~40 standalone repositories (`baileyrd/rusty_db`,
# `baileyrd/rusty_json`, ...) rather than the monorepo the old paths assumed,
# so re-adopting a crate means adding it as a git dependency at the point it
# gains a real call site — not declaring the whole suite up front.

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled", "backup", "functions"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
sha256 = "1.5"
dirs = "5.0"
parking_lot = "0.12"
