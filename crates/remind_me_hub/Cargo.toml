[package]
name = "remind_me_hub"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
rusqlite.workspace = true

# The Postgres backend. Optional because the SQLite backend is complete on its
# own and a self-hosted single-operator hub has no reason to carry a Postgres
# driver -- but see `docs/adr/0015`: it is *on* by default, because the
# reference hub is Postgres-backed and a "successor" that cannot take over an
# existing deployment would not be one.
#
# `with-serde_json-1` is what lets JSONB columns round-trip as
# `serde_json::Value`, which is the same type the wire records already use, so
# tags/metadata/aliases need no bespoke conversion.
postgres = { version = "0.19", features = [
    "with-serde_json-1",
], optional = true }

[features]
default = ["postgres-store"]
# Postgres storage. Named `postgres-store` rather than `postgres` so it does
# not collide with the optional dependency's own implicit feature name.
postgres-store = ["dep:postgres"]

[dev-dependencies]
# The Postgres tests build a legacy-schema database directly, which is the
# only way to exercise the migration that makes this a drop-in.
postgres = { version = "0.19", features = ["with-serde_json-1"] }

[[bin]]
name = "rusty-remind-me-hub"
path = "src/main.rs"
