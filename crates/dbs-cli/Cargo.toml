[package]
name = "dbs-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for rusty_dbs, mirroring dbs.cli.__main__/cli.py in baileyrd/Daily-Backup-System"

[[bin]]
name = "dbs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
dbs-core = { path = "../dbs-core" }
